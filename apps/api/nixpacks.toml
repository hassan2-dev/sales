# Coolify → Nixpacks
# Base directory MUST be: apps/api
# Port: 3000
# Leave Install / Build / Start empty in the UI

[variables]
NIXPACKS_NODE_VERSION = "22"
PORT = "3000"
NPM_CONFIG_ENGINE_STRICT = "false"
# Coolify sets production=true; we still need typescript/@nestjs/cli/prisma for build+migrate
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
nixPkgs = ["...", "openssl"]

[phases.install]
# npm install (not ci): Coolify npm 10 is stricter about optional peer lock entries
cmds = ["npm install --include=dev --no-audit --no-fund"]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build",
]

[start]
cmd = "npx prisma migrate deploy && node dist/main.js"
