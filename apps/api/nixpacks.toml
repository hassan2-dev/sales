# Coolify → Nixpacks (prefer Dockerfile if this keeps failing)
# Base directory: apps/api | Port: 3000 | Install/Build/Start: empty

[variables]
# 22.11 from Nixpacks breaks Nest; 20.x satisfies most engine ranges
NIXPACKS_NODE_VERSION = "20"
PORT = "3000"
NPM_CONFIG_ENGINE_STRICT = "false"
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
nixPkgs = ["...", "openssl"]

[phases.install]
cmds = ["npm install --include=dev --no-audit --no-fund"]

[phases.build]
cmds = [
  "npx prisma generate",
  "rm -rf dist",
  "npm run build",
]

[start]
cmd = "npx prisma migrate deploy && node dist/main.js"
