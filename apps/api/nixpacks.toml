# Coolify → Nixpacks
# Base directory MUST be: apps/api
# Port: 3000
# Leave Install / Build / Start empty in the UI

[variables]
NIXPACKS_NODE_VERSION = "22"
PORT = "3000"
# Avoid hard-fail on engine warnings from Nest tooling
NPM_CONFIG_ENGINE_STRICT = "false"

# "..." keeps Nixpacks defaults (nodejs + npm). Do NOT list only openssl.
[phases.setup]
nixPkgs = ["...", "openssl"]

[phases.install]
cmds = ["npm ci --ignore-engines"]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build",
]

[start]
cmd = "npx prisma migrate deploy && node dist/main.js"
